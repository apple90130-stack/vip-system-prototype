<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粉金 VIP 會員系統</title>
<style>
:root{--rose:#e9a7b7;--deep:#bd6378;--soft:#fff1f5;--gold:#d4aa55;--gold2:#fff7e6;--ink:#30252a;--muted:#74666c;--line:#ecdde2;--shadow:0 18px 50px rgba(118,77,89,.14);--r:8px}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;background:linear-gradient(120deg,#fff1f5,#fff7e6);min-height:100vh}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:28px}.login-panel{width:min(980px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:rgba(255,255,255,.9);border:1px solid rgba(212,170,85,.35);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}.brand{min-height:520px;padding:44px;color:white;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,rgba(189,99,120,.9),rgba(212,170,85,.9)),radial-gradient(circle at 20% 20%,rgba(255,255,255,.45),transparent 30%)}.brand h1{font-size:clamp(34px,6vw,60px);line-height:1.05;margin:24px 0 12px}.brand p{line-height:1.8;max-width:430px}.mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);border-radius:var(--r);padding:14px}.stats strong{display:block;font-size:24px}.formbox{padding:36px;display:grid;align-content:center;gap:18px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:5px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r)}.tabs button{min-height:42px;background:transparent;border-radius:6px;color:var(--muted);font-weight:800}.tabs .active{background:white;color:var(--deep);box-shadow:0 8px 22px rgba(191,102,123,.15)}form{display:grid;gap:13px}label{font-size:13px;color:var(--muted);font-weight:800}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:white}.primary{min-height:44px;padding:0 16px;border-radius:var(--r);background:linear-gradient(135deg,var(--deep),var(--gold));color:white;font-weight:900}.secondary{min-height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:white;color:var(--deep);font-weight:800}.hint{background:var(--gold2);border:1px solid rgba(212,170,85,.35);border-radius:var(--r);padding:12px 14px;color:#765d2a;font-size:13px;line-height:1.7}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{display:flex;gap:12px;align-items:center}.logo .badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--deep),var(--gold));color:white;font-weight:900}.logo span{display:block;color:var(--muted);font-size:12px}.wrap{width:min(1360px,100%);margin:auto;padding:24px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.side,.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(118,77,89,.08)}.side{position:sticky;top:88px;padding:12px}.nav{display:grid;gap:6px}.nav button{display:flex;gap:10px;align-items:center;min-height:42px;border-radius:var(--r);padding:0 12px;background:transparent;color:var(--muted);font-weight:800;text-align:left}.nav .active{background:linear-gradient(135deg,#fff1f5,#fff7e6);color:var(--deep);box-shadow:inset 0 0 0 1px rgba(212,170,85,.22)}.ico{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--soft);color:var(--deep);font-weight:900}.nav .active .ico{background:linear-gradient(135deg,var(--deep),var(--gold));color:white}.main{display:grid;gap:18px}.page{display:none;gap:18px}.page.active{display:grid}.hero{display:grid;grid-template-columns:1fr minmax(280px,.42fr);gap:18px;padding:22px;border-radius:var(--r);background:linear-gradient(135deg,rgba(189,99,120,.96),rgba(212,170,85,.9));box-shadow:var(--shadow);color:white}.hero h2{font-size:clamp(28px,4vw,42px);margin:0 0 10px}.hero p{line-height:1.7}.tags{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;min-height:28px;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--deep);border:1px solid rgba(189,99,120,.18);font-size:12px;font-weight:800}.hero .pill{background:rgba(255,255,255,.22);color:white;border-color:rgba(255,255,255,.36)}.progress{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:var(--r);padding:16px}.line{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}.bar span{display:block;height:100%;background:white;width:var(--v)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:14px}.metric span{color:var(--muted);font-size:13px;font-weight:800}.metric strong{display:block;font-size:24px;margin-top:8px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{padding:16px;display:grid;gap:8px}.item h3{margin:0;font-size:16px}.item small{color:var(--muted);line-height:1.6}.head{display:flex;justify-content:space-between;gap:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:96px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:white}.event{margin-top:8px;font-size:12px;line-height:1.35;background:var(--gold2);color:#755d2c;border-radius:6px;padding:6px}.event.rose{background:var(--soft);color:var(--deep)}.taskform{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;padding:18px}.notice{border-left:4px solid var(--gold);padding:13px 14px;background:var(--gold2);border-radius:0 var(--r) var(--r) 0}.table{overflow:auto}table{width:100%;border-collapse:collapse;background:white;min-width:720px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#fffafb;color:var(--muted);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:white;padding:12px 14px;border-radius:var(--r);box-shadow:var(--shadow);opacity:0;transform:translateY(18px);transition:.22s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.login-panel,.wrap,.hero{grid-template-columns:1fr}.side{position:static}.grid4,.grid2{grid-template-columns:repeat(2,1fr)}.calendar{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid4,.grid2,.calendar,.taskform,.stats{grid-template-columns:1fr}.brand,.formbox,.wrap{padding:20px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-panel"><section class="brand"><div><div class="mark">VIP</div><h1>個人 VIP 會員中心</h1><p>以粉金色調整合會員進度、專屬活動、課程投放、開團預告、打卡任務與後台審核。</p></div><div class="stats"><div><strong>30K</strong><span>VIP 消費門檻</span></div><div><strong>10</strong><span>曬單標準</span></div><div><strong>API</strong><span>已接資料</span></div></div></section><section class="formbox"><div class="tabs"><button id="memberTab" class="active">會員登入</button><button id="adminTab">管理員登入</button></div><form id="memberForm"><label>手機號碼<input id="memberPhone" value="0912345678"></label><label>姓名<input id="memberName" value="林芯妤"></label><button class="primary">進入會員畫面</button><div class="hint">會員以手機號碼與姓名登入，資料會從 API 讀取。</div></form><form id="adminForm" class="hidden"><label>管理員帳號<input id="adminAccount" value="admin"></label><label>密碼<input id="adminPassword" type="password" value="vip2026"></label><button class="primary">進入後台</button><div class="hint">示範帳號：admin，示範密碼：vip2026。</div></form></section></div></div>
<main id="app" class="hidden"></main><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),state={member:null,dashboard:null,admin:null};
const memberNav=[["home","首頁總覽","⌂"],["activities","專屬活動","✦"],["courses","線上課程","▣"],["calendar","開團預告","□"],["checkin","打卡活動","✓"],["tasks","任務上傳","▤"],["announce","公告福利","◈"]];
const adminNav=[["members","會員管理","⌂"],["tags","標籤管理","✦"],["courses","課程投放","▣"],["tasks","任務審核","✓"],["announcements","公告管理","◈"]];
function toast(m){const b=$("#toast");b.textContent=m;b.classList.add("show");clearTimeout(window.t);window.t=setTimeout(()=>b.classList.remove("show"),2600)}
async function api(path,opt={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||"操作失敗");return b}
const pill=v=>`<span class="pill">${v}</span>`,status=v=>({pending:"待審核",approved:"已通過",rejected:"已退回"}[v]||v);
function header(mark,title,sub){return `<header class="top"><div class="logo"><div class="badge">${mark}</div><div><strong>${title}</strong><span>${sub}</span></div></div><button class="secondary" onclick="logout()">登出</button></header>`}
function shell(nav,content){return `<div class="wrap"><aside class="side"><nav class="nav">${nav.map(([k,l,i],n)=>`<button class="${n===0?'active':''}" data-page="${k}"><span class="ico">${i}</span>${l}</button>`).join("")}</nav></aside><section class="main">${content}</section></div>`}
function showPage(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===`page-${p}`))}
function bindNav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function logout(){sessionStorage.clear();$("#login").classList.remove("hidden");$("#app").classList.add("hidden")}
async function renderMember(){state.dashboard=await api(`/api/member/dashboard?memberId=${state.member.id}`);const d=state.dashboard,m=d.member,sp=Math.min(100,Math.round(m.spend/d.rules.amountTarget*100)),sh=Math.min(100,Math.round(m.shares/d.rules.shareTarget*100));const content=`<div id="page-home" class="page active"><div class="hero"><div><h2>${m.name}，歡迎回來</h2><p>目前為 ${m.level}。系統會依你的購買標籤顯示活動、課程與任務。</p><div class="tags">${m.tags.map(pill).join("")}</div></div><div class="progress"><div class="line"><span>累積消費</span><span>$${m.spend.toLocaleString()} / $${d.rules.amountTarget.toLocaleString()}</span></div><div class="bar" style="--v:${sp}%"><span></span></div><div class="line" style="margin-top:18px"><span>曬單次數</span><span>${m.shares} / ${d.rules.shareTarget}</span></div><div class="bar" style="--v:${sh}%"><span></span></div></div></div><div class="grid4"><div class="card metric"><span>跟團次數</span><strong>${m.orders}</strong></div><div class="card metric"><span>累積消費</span><strong>$${m.spend.toLocaleString()}</strong></div><div class="card metric"><span>曬單次數</span><strong>${m.shares}</strong></div><div class="card metric"><span>任務積分</span><strong>${m.points}</strong></div></div></div><div id="page-activities" class="page"><div class="grid2">${d.activities.map(a=>`<article class="card item"><div class="head"><h3>${a.title}</h3>${pill(a.tag)}</div><small>${a.meta}</small></article>`).join("")}</div></div><div id="page-courses" class="page"><div class="grid2">${d.courses.map(c=>`<article class="card item"><div class="head"><h3>${c.title}</h3>${pill(c.tag)}</div><small>${c.time}<br>${c.outline}<br>目前 ${c.signups} 人報名</small><button class="primary" onclick="enroll(${c.id})">我要報名</button></article>`).join("")}</div></div><div id="page-calendar" class="page"><div class="card item"><div class="calendar">${d.calendar.map(x=>`<div class="day"><b>${x.day}</b><div class="event ${x.style}">${x.name}<br>${x.type}</div></div>`).join("")}</div></div></div><div id="page-checkin" class="page"><div class="grid2">${d.checkins.map(a=>`<article class="card item"><div class="head"><h3>${a.tag} 打卡</h3><span class="pill">進行中</span></div><small>${a.meta}</small><button class="secondary" onclick="toast('已送出今日打卡')">完成今日打卡</button></article>`).join("")}</div></div><div id="page-tasks" class="page"><form class="card taskform" id="taskForm"><label>任務名稱<input id="taskTitle" value="社群曬單截圖"></label><label>照片連結<input id="taskUrl" value="https://example.com/share.png"></label><button class="primary">送出審核</button></form><div class="card table"><table><thead><tr><th>任務</th><th>時間</th><th>積分</th><th>狀態</th><th>連結</th></tr></thead><tbody>${d.tasks.map(t=>`<tr><td>${t.title}</td><td>${t.time}</td><td>${t.points}</td><td>${status(t.status)}</td><td><a href="${t.url}" target="_blank">查看</a></td></tr>`).join("")||"<tr><td colspan='5'>目前尚無任務紀錄</td></tr>"}</tbody></table></div></div><div id="page-announce" class="page">${d.announcements.map(a=>`<div class="card item"><div class="notice">${a.text}</div></div>`).join("")}</div>`;$("#app").innerHTML=header("V",`${m.name}的 VIP 會員中心`,"個人化活動、課程、打卡與任務進度")+shell(memberNav,content);$("#login").classList.add("hidden");$("#app").classList.remove("hidden");bindNav();$("#taskForm").onsubmit=submitTask}
async function enroll(id){await api('/api/member/enroll',{method:'POST',body:JSON.stringify({memberId:state.member.id,courseId:id})});toast('報名成功');await renderMember();showPage('courses')}
async function submitTask(e){e.preventDefault();await api('/api/member/tasks',{method:'POST',body:JSON.stringify({memberId:state.member.id,title:$("#taskTitle").value,url:$("#taskUrl").value})});toast('任務已送出');await renderMember();showPage('tasks')}
async function renderAdmin(){state.admin=await api('/api/admin/overview');const d=state.admin;const content=`<div id="page-members" class="page active"><div class="card table"><table><thead><tr><th>會員</th><th>電話</th><th>等級</th><th>消費</th><th>標籤</th></tr></thead><tbody>${d.members.map(m=>`<tr><td>${m.name}</td><td>${m.phone}</td><td>${m.level}</td><td>$${m.spend.toLocaleString()}</td><td>${m.tags.map(pill).join(' ')}</td></tr>`).join('')}</tbody></table></div></div><div id="page-tags" class="page"><form class="card taskform" id="tagForm"><select id="tagMember">${d.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select><input id="tagValue" placeholder="例如：藻油課程"><button class="primary">新增標籤</button></form></div><div id="page-courses" class="page"><form class="card taskform" id="courseForm"><input id="courseTitle" placeholder="課程名稱"><input id="courseTime" placeholder="2026/05/30 20:00"><input id="courseTag" placeholder="益生菌"><button class="primary">新增</button></form><div class="grid2">${d.courses.map(c=>`<article class="card item"><h3>${c.title}</h3><small>${c.time}<br>${c.signups} 人報名</small>${pill(c.tag)}</article>`).join('')}</div></div><div id="page-tasks" class="page"><div class="card table"><table><thead><tr><th>會員</th><th>任務</th><th>狀態</th><th>操作</th></tr></thead><tbody>${d.tasks.map(t=>`<tr><td>${t.memberName}</td><td>${t.title}</td><td>${status(t.status)}</td><td>${t.status==='pending'?`<button class="secondary" onclick="reviewTask(${t.id},'approved')">通過</button> <button class="secondary" onclick="reviewTask(${t.id},'rejected')">退回</button>`:'已完成'}</td></tr>`).join('')}</tbody></table></div></div><div id="page-announcements" class="page"><form class="card taskform" id="noticeForm"><input id="noticeText" placeholder="公告內容"><button class="primary">發布</button></form>${d.announcements.map(a=>`<div class="card item"><div class="notice">${a.text}</div></div>`).join('')}</div>`;$("#app").innerHTML=header('A','管理員總控後台','會員、標籤、課程、公告與審核管理')+shell(adminNav,content);$("#login").classList.add('hidden');$("#app").classList.remove('hidden');bindNav();$("#tagForm").onsubmit=addTag;$("#courseForm").onsubmit=addCourse;$("#noticeForm").onsubmit=addNotice}
async function addTag(e){e.preventDefault();await api('/api/admin/tags',{method:'POST',body:JSON.stringify({memberId:Number($("#tagMember").value),tag:$("#tagValue").value})});toast('標籤已新增');await renderAdmin();showPage('tags')}async function addCourse(e){e.preventDefault();await api('/api/admin/courses',{method:'POST',body:JSON.stringify({title:$("#courseTitle").value,time:$("#courseTime").value,tag:$("#courseTag").value,outline:'後台新增課程'})});toast('課程已新增');await renderAdmin();showPage('courses')}async function reviewTask(id,status){await api('/api/admin/tasks',{method:'PATCH',body:JSON.stringify({id,status})});toast('任務審核已更新');await renderAdmin();showPage('tasks')}async function addNotice(e){e.preventDefault();await api('/api/admin/announcements',{method:'POST',body:JSON.stringify({text:$("#noticeText").value})});toast('公告已發布');await renderAdmin();showPage('announcements')}
$("#memberTab").onclick=()=>{$("#memberTab").classList.add('active');$("#adminTab").classList.remove('active');$("#memberForm").classList.remove('hidden');$("#adminForm").classList.add('hidden')};$("#adminTab").onclick=()=>{$("#adminTab").classList.add('active');$("#memberTab").classList.remove('active');$("#adminForm").classList.remove('hidden');$("#memberForm").classList.add('hidden')};$("#memberForm").onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/member/login',{method:'POST',body:JSON.stringify({name:$("#memberName").value,phone:$("#memberPhone").value})});state.member=r.member;sessionStorage.setItem('member',JSON.stringify(state.member));await renderMember()}catch(err){toast(err.message)}};$("#adminForm").onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({account:$("#adminAccount").value,password:$("#adminPassword").value})});sessionStorage.setItem('admin','ok');await renderAdmin()}catch(err){toast(err.message)}};(async()=>{const m=sessionStorage.getItem('member');if(m){state.member=JSON.parse(m);await renderMember()}else if(sessionStorage.getItem('admin')==='ok'){await renderAdmin()}})();
</script>
</body>
</html>
